<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Five readiness questions</title>
  <desc id="desc">Five large numbered checklist cards ask about centralization, harmonization, information movement, evaluation, and responsibility.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ee}.card{fill:#fff;stroke:#d8e0e4;stroke-width:3}.circle{fill:#0c6b6f}.ink{fill:#10243f}.muted{fill:#596579}.coral{fill:#c85446}.h{font:900 38px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.p{font:800 22px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.s{font:600 17px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.num{font:900 28px -apple-system,BlinkMacSystemFont,Segoe UI,Arial;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="h ink" x="700" y="80" text-anchor="middle">Five questions before starting</text>
  <g transform="translate(70 155)">
    <rect class="card" width="240" height="420" rx="8"/><circle class="circle" cx="50" cy="55" r="30"/><text class="num" x="50" y="65" text-anchor="middle">1</text>
    <text class="p ink" x="30" y="125">Why can the</text><text class="p ink" x="30" y="153">data not be</text><text class="p ink" x="30" y="181">centralized?</text><text class="s muted" x="30" y="300">Legal, practical,</text><text class="s muted" x="30" y="324">scientific, or trust?</text>
  </g>
  <g transform="translate(335 155)">
    <rect class="card" width="240" height="420" rx="8"/><circle class="circle" cx="50" cy="55" r="30"/><text class="num" x="50" y="65" text-anchor="middle">2</text>
    <text class="p ink" x="30" y="125">Are variables,</text><text class="p ink" x="30" y="153">labels, and</text><text class="p ink" x="30" y="181">preprocessing</text><text class="p ink" x="30" y="209">aligned?</text><text class="s muted" x="30" y="324">Same meaning?</text>
  </g>
  <g transform="translate(600 155)">
    <rect class="card" width="240" height="420" rx="8"/><circle class="circle" cx="50" cy="55" r="30"/><text class="num" x="50" y="65" text-anchor="middle">3</text>
    <text class="p ink" x="30" y="125">What exactly</text><text class="p ink" x="30" y="153">leaves each</text><text class="p ink" x="30" y="181">institution?</text><text class="s muted" x="30" y="300">Updates, metrics,</text><text class="s muted" x="30" y="324">counts, logs?</text>
  </g>
  <g transform="translate(865 155)">
    <rect class="card" width="240" height="420" rx="8"/><circle class="circle" cx="50" cy="55" r="30"/><text class="num" x="50" y="65" text-anchor="middle">4</text>
    <text class="p ink" x="30" y="125">How will</text><text class="p ink" x="30" y="153">performance be</text><text class="p ink" x="30" y="181">evaluated?</text><text class="s muted" x="30" y="300">Every site and</text><text class="s muted" x="30" y="324">outside the federation.</text>
  </g>
  <g transform="translate(1130 155)">
    <rect class="card" width="240" height="420" rx="8"/><circle class="circle" cx="50" cy="55" r="30"/><text class="num" x="50" y="65" text-anchor="middle">5</text>
    <text class="p ink" x="30" y="125">Who is</text><text class="p ink" x="30" y="153">responsible</text><text class="p ink" x="30" y="181">when it fails?</text><text class="s muted" x="30" y="300">Drift, withdrawal,</text><text class="s muted" x="30" y="324">incident response.</text>
  </g>
  <text class="p coral" x="700" y="675" text-anchor="middle">Begin with the collaboration problem.</text>
</svg>
