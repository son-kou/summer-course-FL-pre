<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">One federated learning round</title>
  <desc id="desc">A model is initialized, sent to hospitals, updated locally, returned as updates, aggregated, and redistributed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#0c6b6f"/></marker>
    <style>
      .bg{fill:#f7f4ee}.hub{fill:#d6ece9;stroke:#0c6b6f;stroke-width:5}.site{fill:#fff;stroke:#d8e0e4;stroke-width:3}.line{fill:none;stroke:#0c6b6f;stroke-width:5;marker-end:url(#arrow)}.back{fill:none;stroke:#c85446;stroke-width:5;stroke-dasharray:12 12;marker-end:url(#arrow)}.ink{fill:#10243f}.muted{fill:#596579}.teal{fill:#0c6b6f}.coral{fill:#c85446}.h{font:800 36px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.p{font:700 22px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.s{font:500 18px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.num{font:900 24px -apple-system,BlinkMacSystemFont,Segoe UI,Arial;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <circle class="hub" cx="700" cy="375" r="110"/>
  <text class="h ink" x="700" y="355" text-anchor="middle">Global</text>
  <text class="h ink" x="700" y="400" text-anchor="middle">model</text>
  <text class="s muted" x="700" y="438" text-anchor="middle">orchestrator / aggregator</text>
  <g transform="translate(110 110)"><rect class="site" width="260" height="150" rx="8"/><text class="p ink" x="30" y="45">Hospital A</text><text class="s muted" x="30" y="80">local training</text><text class="s muted" x="30" y="112">raw data stays here</text></g>
  <g transform="translate(1030 110)"><rect class="site" width="260" height="150" rx="8"/><text class="p ink" x="30" y="45">Hospital B</text><text class="s muted" x="30" y="80">local training</text><text class="s muted" x="30" y="112">raw data stays here</text></g>
  <g transform="translate(110 505)"><rect class="site" width="260" height="150" rx="8"/><text class="p ink" x="30" y="45">Hospital C</text><text class="s muted" x="30" y="80">local training</text><text class="s muted" x="30" y="112">raw data stays here</text></g>
  <g transform="translate(1030 505)"><rect class="site" width="260" height="150" rx="8"/><text class="p ink" x="30" y="45">Hospital D</text><text class="s muted" x="30" y="80">local training</text><text class="s muted" x="30" y="112">raw data stays here</text></g>
  <line class="line" x1="616" y1="306" x2="376" y2="207"/><line class="line" x1="784" y1="306" x2="1024" y2="207"/><line class="line" x1="616" y1="444" x2="376" y2="548"/><line class="line" x1="784" y1="444" x2="1024" y2="548"/>
  <line class="back" x1="385" y1="238" x2="600" y2="330"/><line class="back" x1="1015" y1="238" x2="800" y2="330"/><line class="back" x1="385" y1="575" x2="600" y2="420"/><line class="back" x1="1015" y1="575" x2="800" y2="420"/>
  <g transform="translate(80 310)"><circle class="teal" cx="30" cy="30" r="28"/><text class="num" x="30" y="39" text-anchor="middle">1</text><text class="p ink" x="78" y="38">Initialize</text></g>
  <g transform="translate(1045 310)"><circle class="teal" cx="30" cy="30" r="28"/><text class="num" x="30" y="39" text-anchor="middle">2</text><text class="p ink" x="78" y="38">Distribute</text></g>
  <g transform="translate(80 382)"><circle class="coral" cx="30" cy="30" r="28"/><text class="num" x="30" y="39" text-anchor="middle">3</text><text class="p ink" x="78" y="38">Update locally</text></g>
  <g transform="translate(1045 382)"><circle class="coral" cx="30" cy="30" r="28"/><text class="num" x="30" y="39" text-anchor="middle">4</text><text class="p ink" x="78" y="38">Aggregate</text></g>
  <text class="s muted" x="700" y="700" text-anchor="middle">Solid arrows: model sent out. Dashed arrows: updates and metrics return.</text>
</svg>
