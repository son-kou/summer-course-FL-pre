<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Global average can conceal failing sites</title>
  <desc id="desc">Per-site AUROC bars show Hospital C performing poorly while the global average appears acceptable.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ee}.ink{fill:#10243f}.muted{fill:#596579}.teal{fill:#0c6b6f}.coral{fill:#c85446}.amber{fill:#d99a2b}.grid{stroke:#d8e0e4;stroke-width:2}.axis{stroke:#596579;stroke-width:3}.h{font:900 42px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.p{font:800 26px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.s{font:500 19px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}.num{font:900 32px -apple-system,BlinkMacSystemFont,Segoe UI,Arial}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="h ink" x="90" y="88">The global-average trap</text>
  <text class="s muted" x="90" y="125">Illustrative values only, not empirical results from a named study.</text>
  <g transform="translate(135 180)">
    <line class="grid" x1="0" y1="0" x2="820" y2="0"/><line class="grid" x1="0" y1="100" x2="820" y2="100"/><line class="grid" x1="0" y1="200" x2="820" y2="200"/><line class="grid" x1="0" y1="300" x2="820" y2="300"/><line class="axis" x1="0" y1="360" x2="820" y2="360"/>
    <rect x="60" y="50" width="130" height="310" fill="#0c6b6f"/><rect x="250" y="96" width="130" height="264" fill="#d99a2b"/><rect x="440" y="200" width="130" height="160" fill="#c85446"/><rect x="660" y="86" width="130" height="274" fill="#596579"/>
    <text class="p ink" x="125" y="405" text-anchor="middle">A</text><text class="p ink" x="315" y="405" text-anchor="middle">B</text><text class="p ink" x="505" y="405" text-anchor="middle">C</text><text class="p ink" x="725" y="405" text-anchor="middle">Global</text>
    <text class="num ink" x="125" y="32" text-anchor="middle">0.86</text><text class="num ink" x="315" y="78" text-anchor="middle">0.79</text><text class="num coral" x="505" y="182" text-anchor="middle">0.63</text><text class="num ink" x="725" y="68" text-anchor="middle">0.80</text>
  </g>
  <g transform="translate(1010 220)">
    <rect width="300" height="290" rx="8" fill="#fff" stroke="#d8e0e4" stroke-width="3"/>
    <text class="p ink" x="28" y="45">Ask:</text>
    <text class="s muted" x="28" y="88">Who benefits?</text>
    <text class="s muted" x="28" y="128">Where does it fail?</text>
    <text class="s muted" x="28" y="168">Is it calibrated?</text>
    <text class="s muted" x="28" y="208">Which subgroups?</text>
    <text class="s muted" x="28" y="248">External validation?</text>
  </g>
</svg>
