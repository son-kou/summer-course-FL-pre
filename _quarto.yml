project:
  type: website
  output-dir: _site
  resources:
    - assets/**
    - demo/**
    - labs/**
    - downloads/**
    - references.bib

website:
  title: "Federated Learning in Medical AI"
  site-url: "https://son-kou.github.io/summer-course-FL-pre/"
  repo-url: "https://github.com/son-kou/summer-course-FL-pre"
  navbar:
    left:
      - text: "Slides"
        href: index.html
      - text: "Course Materials"
        href: resources.html#course-materials
      - text: "Labs"
        href: resources.html#interactive-labs
      - text: "Further Reading"
        href: resources.html#further-reading
      - text: "Full References"
        href: references.html
    right:
      - icon: github
        href: "https://github.com/son-kou/summer-course-FL-pre"

format:
  html:
    theme: cosmo
    css: styles/site.css
    toc: true
    link-external-newwindow: true
    smooth-scroll: true

bibliography: references.bib

execute:
  freeze: auto
