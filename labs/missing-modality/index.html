<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missing-Modality Lab</title>
  <script>if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lab-shell">
    <section class="panel">
      <p class="eyebrow">Missing-modality lab</p>
      <h1>Federation sees a mosaic, not a spreadsheet</h1>
      <div id="matrix" class="matrix" aria-label="Modality availability matrix"></div>
    </section>
    <section class="panel">
      <h2>Design consequences</h2>
      <div id="recommendations" class="recommendations"></div>
      <p class="warning">Reconstruction or imputation may help a model run; it does not remove missing-data bias.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
